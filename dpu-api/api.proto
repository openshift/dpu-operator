syntax = "proto3";

option go_package = "github.com/openshift/dpu-operator/api/dpu-api";

package Vendor;

service LifeCycleService {
  rpc Init(InitRequest) returns (IpPort);
}

service DpuNetworkConfigService {
  rpc SetDpuNetworkConfig(DpuNetworkConfigRequest) returns (Empty);
}

service NetworkFunctionService {
  rpc CreateNetworkFunction(NFRequest) returns (Empty);
  rpc DeleteNetworkFunction(NFRequest) returns (Empty);
}

service DataProcessingUnitManagementService {
  // Reboot the DPU managed by this VSP. The VSP already knows its own
  // PCIe address from Init(), so the request carries no device identifiers.
  rpc DpuRebootFunction(DPURebootRequest) returns (DPUManagementResponse);
  // Upgrade firmware on the DPU managed by this VSP.
  rpc DpuFirmwareUpgradeFunction(DPUFirmwareUpgradeRequest) returns (DPUManagementResponse);
}

message InitRequest {
  bool dpu_mode = 1;
  string dpu_identifier = 2;
}

message IpPort {
  string ip = 1;
  int32 port = 2;
}

message NFRequest {
  string input = 1;
  string output = 2;
  string bridge_id = 3;
}

message DpuNetworkConfigRequest {
  bool is_accelerated = 1;
}

message Empty {}

service DeviceService {
  rpc GetDevices(Empty) returns (DeviceListResponse);
  rpc SetNumVfs(VfCount) returns (VfCount);
}

message VfCount {
  int32 vf_cnt = 1;
}

message TopologyInfo {
  string node = 1;
}

message Device {
  string ID = 1;
  string health = 2;
  TopologyInfo topology = 3;
}

message DeviceListResponse {
  map<string, Device> devices = 1;
}

service HeartbeatService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  int64 timestamp = 1;
  string sender_id = 2;
}

message PingResponse {
  int64 timestamp = 1;
  string responder_id = 2;
  bool healthy = 3;
}

// DPURebootRequest is intentionally empty. The gRPC connection is per-VSP,
// so the VSP already knows which DPU it manages (PCIe address, etc.).
// Adding optional fields for future extensibility (e.g. force flag).
message DPURebootRequest {
  // If true, perform a hard/forced reboot instead of a graceful one.
  bool force = 1;
}

// DPUFirmwareUpgradeRequest carries only the firmware-specific parameters.
// Device identification is implicit — the VSP knows its DPU from Init().
message DPUFirmwareUpgradeRequest {
  // Firmware type (e.g. "OAM", "SDK").
  string firmware_type = 1;
  // Path or URI of the firmware image (e.g. "quay.io/openshift/firmware/dpu:v1.0.8").
  string firmware_image_path = 2;
}

message DPUManagementResponse {
  // Whether the operation was accepted / succeeded.
  bool success = 1;
  // Human-readable status string (e.g. "Rebooting", "UpgradeStarted").
  string status = 2;
  // Additional detail or error message.
  string message = 3;
}