syntax = "proto3";

// go_package sets the full Go import path so that
//   import sgpb "github.com/openshift/dpu-operator/internal/daemon/vendor-specific-plugins/synaxg/protos/gen"
// resolves correctly from the VSP's main.go.
//
// The original SynaXG OAM SDK ships four separate proto files
// (Common.proto, System.proto, Software.proto, Heartbeat.proto).
// They are consolidated here into one file to avoid cross-file import
// complexity in this project.  All definitions are verbatim from the SDK;
// additions / omissions are marked with NOTE comments.
option go_package = "github.com/openshift/dpu-operator/internal/daemon/vendor-specific-plugins/synaxg/protos/gen";

package synaxg;

// =============================================================================
// Common.proto — shared status enum
// =============================================================================

enum ResultStatus {
    SUCCESS = 0;
    FAIL    = 1;
}

// =============================================================================
// Software.proto — SoftwareManagementService
// VSP uses: SoftwareUpgradeStream
// =============================================================================

service SoftwareManagementService {
    // Used by VSP (streamFirmwareToOAM): streams firmware in 1 MiB chunks.
    rpc SoftwareUpgradeStream(stream SoftwareUpgradeStreamRequest) returns (SoftwareUpgradeResponse);

    // NOTE: Not used by the current VSP. TFTP-based upgrade path kept for
    // completeness; remove if the OAM SDK drops it in a future release.
    rpc SoftwareUpgrade(SoftwareUpgradeRequest) returns (SoftwareUpgradeResponse);

    // NOTE: Not used by the current VSP.
    rpc SoftwareStop(SoftwareStopRequest) returns (SoftwareStopResponse);
}

message SoftwareStopRequest {
    bool enableStop = 1;
}

message SoftwareStopResponse {
    ResultStatus result        = 1;
    string       error_message = 2;
}

// TFTP-based upgrade request (not used by VSP).
message SoftwareUpgradeRequest {
    // The URI of the software image including username.
    // Format: tftp://<host>[:<port>]/file-with-path
    // Example: tftp://192.168.2.1:69//root/package/software-upgrade.tar.gz
    string    remote_file = 1;
    ImageType type        = 2;
}

// One chunk of the firmware file being streamed to OAM (used by VSP).
message SoftwareUpgradeStreamRequest {
    // File path on the OAM side, e.g. /root/package/software-upgrade.tar.gz
    string remote_file = 1;
    bytes  chunk_data  = 2;
}

// NOTE: UPG_SUCCESS = 0, which is also the proto3 default (zero) value.
// The VSP checks upgradeResp.Result == UPG_SUCCESS and UPG_NOT_RUNNING;
// both values match the SDK definition below.
enum UpgradeResultStatus {
    UPG_SUCCESS     = 0;
    UPG_FAIL        = 1;
    UPG_NOT_RUNNING = 2;
}

message SoftwareUpgradeResponse {
    UpgradeResultStatus result        = 1;
    string              error_message = 2; // empty when result is SUCCESS
}

enum ImageType {
    APP = 0;
    SDK = 1;
    PLL = 2;
}

// =============================================================================
// System.proto — SystemManagementService
// VSP uses: GetSystemBasicInfo (to read firmware_version before upgrade)
// =============================================================================

service SystemManagementService {
    // Used by VSP (checkFirmwareVersion): reads firmware_version from the card.
    rpc GetSystemBasicInfo(GetSystemBasicInfoRequest) returns (GetSystemBasicInfoResponse);

    // NOTE: Not used by the current VSP. Card reboot is handled via PCI
    // driver unbind/bind in performRebootCycle(), not via this RPC.
    rpc Reboot(SystemRebootRequest) returns (SystemRebootResponse);
}

message GetSystemBasicInfoRequest {}

message GetSystemBasicInfoResponse {
    ResultStatus    result        = 1;
    string          error_message = 2; // empty when result is SUCCESS
    SystemBasicInfo system_info   = 3; // null when result is FAIL
}

message SystemBasicInfo {
    string mfg_name         = 1;
    string model_name       = 2;
    string serial_num       = 3;
    string product_code     = 4;
    string hardware_version = 5;
    string firmware_version = 6; // read by VSP for upgrade version comparison
    string phy_version      = 7;
    string oam_version      = 8;
}

message SystemRebootRequest {}

message SystemRebootResponse {
    ResultStatus result        = 1;
    string       error_message = 2;
}

// =============================================================================
// Heartbeat.proto — HeartbeatService (OAM SDK definition)
// NOTE: The VSP does NOT use this service for heartbeating.
// Heartbeat is handled via pb.HeartbeatService from dpu-api/gen (the
// operator-level API), which is proxied to the OAM's own Ping endpoint.
// This definition is kept here for SDK completeness only.
// =============================================================================

service HeartbeatService {
    // Sent from server-OAM to vDU-OAM periodically (default period: 1 minute).
    // Not called by the VSP; included for SDK API completeness.
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message HeartbeatRequest {
    int32 notify_interval = 1;
}

message HeartbeatResponse {
    ResultStatus result        = 1;
    string       error_message = 2; // empty when result is SUCCESS
}
